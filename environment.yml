# Conda environment for mmIR.
#
# Tested with Python 3.12 + CUDA 11.8 (PyTorch) on an NVIDIA RTX 4090. CuPy and
# FAISS ship their own CUDA 12 runtime libraries as pip packages.

name: mmir
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.7.1+cu118
      - mitsuba==3.7.1
      - drjit==1.2.0
      - slangtorch==1.3.11
      - numpy==1.26.0
      - scipy==1.16.1
      - scikit-image==0.25.2
      - matplotlib==3.10.5
      - trimesh==4.7.4
      - open3d==0.19.0
      - Pillow==11.3.0
      - tqdm==4.67.1
      # GPU LiDAR alignment (needs a CUDA 12 runtime)
      - cupy-cuda12x==13.6.0
      # GPU nearest-neighbour search for LiDAR preprocessing
      - faiss-gpu-cu12==1.9.0.0
